# ╔════════════════════════════════════════════════════════════════════╗
# ║                  AppleCosmetic — облики мечей                      ║
# ╚════════════════════════════════════════════════════════════════════╝
# Выбранный облик меняет внешний вид всех мечей в инвентаре игрока.
# Урон, чары и прочность остаются прежними — меняется только модель.
# Мечи, у которых уже есть своя модель (например, предметы ItemsAdder), не затрагиваются.
#
# Поля:
#   name        — название в меню
#   item        — откуда брать модель (форматы предметов описаны в config.yml).
#                 Можно указать список: берётся первый доступный вариант
#   icon        — иконка в меню; если не указана, берётся item
#   lore        — описание в меню
#   permission  — право доступа; по умолчанию applecosmetic.sword.<id>,
#                 пустая строка "" делает облик доступным всем
#
# Ниже первым идёт 3D-модель из набора AppleCosmetic для ItemsAdder (плагин сам кладёт
# набор в plugins/ItemsAdder/contents/applecosmetic), вторым — обычный предмет Minecraft,
# который используется, пока ItemsAdder не установлен.
#
# Свои модели подключаются так же:
#   item: "itemsadder:mypack:ice_sword"
#   item: "nexo:ice_sword"
#   item: "model:mypack:ice_sword"
#   item: "PAPER:1001"

items:
  frost:
    name: "<gradient:#a8e6ff:#58b4e6>Ледяной клинок</gradient>"
    item: ["itemsadder:applecosmetic:sword_frost", BREEZE_ROD]
    lore:
      - "<gray>Клинок из вечного льда."

  blood:
    name: "<gradient:#ff5a5a:#8a0f1c>Кровавый жнец</gradient>"
    item: ["itemsadder:applecosmetic:sword_blood", NETHERITE_SWORD]
    lore:
      - "<gray>Зазубренная сталь, не знающая пощады."

  emerald:
    name: "<gradient:#7dffb0:#17a05a>Изумрудный страж</gradient>"
    item: ["itemsadder:applecosmetic:sword_emerald", GOLDEN_SWORD]
    lore:
      - "<gray>Изумруд в золотой оправе."

  amethyst:
    name: "<gradient:#d39bff:#8a4dff>Аметистовый осколок</gradient>"
    item: ["itemsadder:applecosmetic:sword_amethyst", AMETHYST_SHARD]
    lore:
      - "<gray>Острый кристалл из глубин жеоды."

  solar:
    name: "<gradient:#ffe259:#ff8a1f>Клинок солнца</gradient>"
    item: ["itemsadder:applecosmetic:sword_solar", BLAZE_ROD]
    lore:
      - "<gray>Пламенеющий клинок цвета рассвета."

  abyss:
    name: "<gradient:#2af5d0:#0d5c6b>Клинок бездны</gradient>"
    item: ["itemsadder:applecosmetic:sword_abyss", ECHO_SHARD]
    lore:
      - "<gray>Руны светятся в темноте глубин."

  sakura:
    name: "<gradient:#ffd1dc:#ff7fa8>Клинок сакуры</gradient>"
    item: ["itemsadder:applecosmetic:sword_sakura", PINK_TULIP]
    lore:
      - "<gray>Катана цвета весеннего цветения."

  nature:
    name: "<gradient:#b6f27a:#3f8f2f>Клинок леса</gradient>"
    item: ["itemsadder:applecosmetic:sword_nature", BAMBOO]
    lore:
      - "<gray>Живое дерево, оплетённое лозой."

  thunder:
    name: "<gradient:#fff59d:#4d9dff>Громовой клинок</gradient>"
    item: ["itemsadder:applecosmetic:sword_thunder", TRIDENT]
    lore:
      - "<gray>Застывшая молния."

  lunar:
    name: "<gradient:#c9b8ff:#5a3fb0>Лунный серп</gradient>"
    item: ["itemsadder:applecosmetic:sword_lunar", NETHERITE_HOE]
    lore:
      - "<gray>Полумесяц на ночном небе."
