# ╔════════════════════════════════════════════════════════════════════╗
# ║                  AppleCosmetic — облики кирок                      ║
# ╚════════════════════════════════════════════════════════════════════╝
# Выбранный облик меняет внешний вид всех кирок в инвентаре игрока.
# Скорость добычи, чары и прочность остаются прежними — меняется только модель.
# Кирки, у которых уже есть своя модель (например, предметы ItemsAdder), не затрагиваются.
#
# Поля:
#   name        — название в меню
#   item        — откуда брать модель (форматы предметов описаны в config.yml).
#                 Можно указать список: берётся первый доступный вариант
#   icon        — иконка в меню; если не указана, берётся item
#   lore        — описание в меню
#   permission  — право доступа; по умолчанию applecosmetic.pickaxe.<id>,
#                 пустая строка "" делает облик доступным всем
#
# Ниже первым идёт 3D-модель из набора AppleCosmetic для ItemsAdder (плагин сам кладёт
# набор в plugins/ItemsAdder/contents/applecosmetic), вторым — обычный предмет Minecraft,
# который используется, пока ItemsAdder не установлен.
#
# Свои модели подключаются так же:
#   item: "itemsadder:mypack:crystal_pickaxe"
#   item: "nexo:crystal_pickaxe"
#   item: "model:mypack:crystal_pickaxe"
#   item: "PAPER:2001"

items:
  crystal:
    name: "<gradient:#8ff0f0:#25b7c4>Кристальная кирка</gradient>"
    item: ["itemsadder:applecosmetic:pickaxe_crystal", DIAMOND_PICKAXE]
    lore:
      - "<gray>Грани прочнее алмаза."

  magma:
    name: "<gradient:#ffb347:#d93a1a>Магмовая кирка</gradient>"
    item: ["itemsadder:applecosmetic:pickaxe_magma", NETHERITE_PICKAXE]
    lore:
      - "<gray>Базальт, в трещинах которого течёт лава."

  royal:
    name: "<gradient:#ffe259:#ffa751>Королевская кирка</gradient>"
    item: ["itemsadder:applecosmetic:pickaxe_royal", GOLDEN_PICKAXE]
    lore:
      - "<gray>Золото и рубины для самой дорогой руды."

  bone:
    name: "<gradient:#f2efe4:#bdb7a4>Костяная кирка</gradient>"
    item: ["itemsadder:applecosmetic:pickaxe_bone", BONE]
    lore:
      - "<gray>Собрана из того, что осталось от шахтёров."

  amethyst:
    name: "<gradient:#d39bff:#8a4dff>Аметистовая кирка</gradient>"
    item: ["itemsadder:applecosmetic:pickaxe_amethyst", AMETHYST_SHARD]
    lore:
      - "<gray>Друзы кристаллов вместо стали."

  forest:
    name: "<gradient:#b6f27a:#3f8f2f>Кирка леса</gradient>"
    item: ["itemsadder:applecosmetic:pickaxe_forest", WOODEN_PICKAXE]
    lore:
      - "<gray>Живое дерево, мох и листья."

  drill:
    name: "<gradient:#ffd54f:#8f9bb3>Бур</gradient>"
    item: ["itemsadder:applecosmetic:pickaxe_drill", COPPER_PICKAXE]
    lore:
      - "<gray>Техника на службе шахтёра."

  frost:
    name: "<gradient:#e0f7ff:#7de8ff>Ледоруб</gradient>"
    item: ["itemsadder:applecosmetic:pickaxe_frost", IRON_PICKAXE]
    lore:
      - "<gray>Покрыт инеем и сосульками."

  ender:
    name: "<gradient:#c77dff:#3a1466>Кирка Края</gradient>"
    item: ["itemsadder:applecosmetic:pickaxe_ender", END_ROD]
    lore:
      - "<gray>Обсидиан и всевидящее око."

  star:
    name: "<gradient:#ffe9a8:#3b4fb5>Звёздная кирка</gradient>"
    item: ["itemsadder:applecosmetic:pickaxe_star", NETHER_STAR]
    lore:
      - "<gray>Осколок ночного неба."
