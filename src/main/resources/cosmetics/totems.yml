# ╔════════════════════════════════════════════════════════════════════╗
# ║                 AppleCosmetic — облики тотемов                     ║
# ╚════════════════════════════════════════════════════════════════════╝
# Выбранный облик меняет внешний вид тотемов бессмертия в инвентаре игрока
# и анимацию на экране, когда тотем срабатывает. Сам тотем действует как обычно.
# Тотемы, у которых уже есть своя модель (например, предметы ItemsAdder), не затрагиваются.
#
# Поля:
#   name        — название в меню
#   item        — откуда брать модель (форматы предметов описаны в config.yml).
#                 Можно указать список: берётся первый доступный вариант
#   icon        — иконка в меню; если не указана, берётся item
#   lore        — описание в меню
#   permission  — право доступа; по умолчанию applecosmetic.totem.<id>,
#                 пустая строка "" делает облик доступным всем
#
# Ниже первым идёт 3D-модель из набора AppleCosmetic для ItemsAdder (плагин сам кладёт
# набор в plugins/ItemsAdder/contents/applecosmetic), вторым — обычный предмет Minecraft,
# который используется, пока ItemsAdder не установлен.
#
# Свои модели подключаются так же:
#   item: "itemsadder:mypack:angel_totem"
#   item: "nexo:angel_totem"
#   item: "model:mypack:angel_totem"
#   item: "PAPER:3001"

items:
  angel:
    name: "<gradient:#ffffff:#ffe9a8>Ангел-хранитель</gradient>"
    item: ["itemsadder:applecosmetic:totem_angel", FEATHER]
    lore:
      - "<gray>Он присматривает за вами."

  demon:
    name: "<gradient:#ff5a5a:#5a0f14>Демон</gradient>"
    item: ["itemsadder:applecosmetic:totem_demon", WITHER_SKELETON_SKULL]
    lore:
      - "<gray>Сделка, о которой вы не пожалеете."

  frost:
    name: "<gradient:#e0f7ff:#58b4e6>Ледяной дух</gradient>"
    item: ["itemsadder:applecosmetic:totem_frost", BLUE_ICE]
    lore:
      - "<gray>Холод, который бережёт жизнь."

  golden:
    name: "<gradient:#ffe259:#ffa751>Золотой идол</gradient>"
    item: ["itemsadder:applecosmetic:totem_golden", ENCHANTED_GOLDEN_APPLE]
    lore:
      - "<gray>Идол древнего храма солнца."

  forest:
    name: "<gradient:#b6f27a:#3f8f2f>Дух леса</gradient>"
    item: ["itemsadder:applecosmetic:totem_forest", OAK_SAPLING]
    lore:
      - "<gray>Маленький хранитель большой чащи."

  ocean:
    name: "<gradient:#2af5d0:#2a7fff>Страж глубин</gradient>"
    item: ["itemsadder:applecosmetic:totem_ocean", HEART_OF_THE_SEA]
    lore:
      - "<gray>Его глаз следит за опасностью."

  heart:
    name: "<gradient:#ff9ac1:#ff2e63>Крылатое сердце</gradient>"
    item: ["itemsadder:applecosmetic:totem_heart", POPPY]
    lore:
      - "<gray>Вторая жизнь — от чистого сердца."

  skull:
    name: "<gradient:#f2efe4:#8e9eab>Череп</gradient>"
    item: ["itemsadder:applecosmetic:totem_skull", SKELETON_SKULL]
    lore:
      - "<gray>Смерть отступает перед смертью."

  ender:
    name: "<gradient:#c77dff:#3a1466>Идол Края</gradient>"
    item: ["itemsadder:applecosmetic:totem_ender", ENDER_EYE]
    lore:
      - "<gray>Око видит миг до гибели."

  cat:
    name: "<gradient:#ffffff:#ffcf5a>Кот удачи</gradient>"
    item: ["itemsadder:applecosmetic:totem_cat", COD]
    lore:
      - "<gray>У кошки девять жизней. Одной она поделится."
